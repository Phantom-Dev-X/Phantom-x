<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventide Omega • Create Account</title>
    <style>
        body {font-family:'Segoe UI',sans-serif;background:#06090f;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .card {background:#111827;border:1px solid #1a2540;border-radius:20px;padding:40px 36px;width:100%;max-width:420px}
        .logo {display:flex;align-items:center;gap:12px;margin-bottom:24px;justify-content:center}
        .logo-text {font-size:20px;font-weight:800;background:linear-gradient(135deg,#22d3ee,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        h1 {text-align:center;margin-bottom:24px}
        .input {width:100%;padding:13px 16px;background:#0f1729;border:1px solid #1a2540;border-radius:12px;color:white;margin-bottom:16px}
        .btn {width:100%;padding:14px;background:linear-gradient(135deg,#06b6d4,#0891b2);border:none;border-radius:12px;color:white;font-weight:700;cursor:pointer}
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="#22d3ee" stroke-width="1.5"/><path d="M18 6 L18 18 L26 24" stroke="#22d3ee" stroke-width="2.5"/><circle cx="18" cy="18" r="3" fill="#22d3ee"/></svg>
            <span class="logo-text">EVENTIDE OMEGA</span>
        </div>
        <h1>Create Account</h1>
        
        <input type="text" class="input" placeholder="Full Name">
        <input type="email" class="input" placeholder="Email Address">
        <input type="password" class="input" placeholder="Password">
        
        <button class="btn" onclick="createAccount()">Create Account</button>
        
        <p style="text-align:center;margin-top:20px;font-size:13px;color:#64748b">
            Already have an account? <a href="index.html" style="color:#22d3ee">Login</a>
        </p>
    </div>

    <script>
        function createAccount() {
            alert("Account created successfully! Redirecting to login...");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
